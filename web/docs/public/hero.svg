<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="400" height="300" fill="url(#bg)" rx="16"/>

  <text x="200" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e40af">Sliding Window on [1, 3, 2, 6, -1, 4, 1, 8, 2]</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="30"  y="90" width="38" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
    <rect x="72"  y="90" width="38" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="114" y="90" width="38" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="156" y="90" width="38" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="198" y="90" width="38" height="42" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
    <rect x="240" y="90" width="38" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
    <rect x="282" y="90" width="38" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
    <rect x="324" y="90" width="38" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>

    <g font-size="17" font-weight="700" fill="#0b1220" text-anchor="middle">
      <text x="49"  y="118">1</text>
      <text x="91"  y="118">3</text>
      <text x="133" y="118">2</text>
      <text x="175" y="118">6</text>
      <text x="217" y="118">-1</text>
      <text x="259" y="118">4</text>
      <text x="301" y="118">1</text>
      <text x="343" y="118">8</text>
    </g>
  </g>

  <rect x="26" y="82" width="216" height="58" rx="10" fill="none" stroke="#2563eb" stroke-width="2.4"/>
  <rect x="68" y="88" width="216" height="58" rx="10" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="6 4"/>

  <text x="134" y="72" text-anchor="middle" font-family="Segoe UI" font-size="10.5" font-weight="700" fill="#2563eb">window sum = 11</text>
  <text x="176" y="164" text-anchor="middle" font-family="Segoe UI" font-size="10.5" font-weight="700" fill="#16a34a">→ new sum = 14</text>

  <path d="M 49,155 L 49,140" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <text x="49" y="182" text-anchor="middle" font-size="10.5" font-weight="600" fill="#dc2626">− 1</text>
  <path d="M 259,155 L 259,140" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)" fill="none"/>
  <text x="259" y="182" text-anchor="middle" font-size="10.5" font-weight="600" fill="#16a34a">+ 4</text>

  <rect x="30" y="215" width="340" height="60" rx="10" fill="#f5f7fa" stroke="#dce1ea" stroke-width="1"/>
  <text x="200" y="238" text-anchor="middle" font-family="Segoe UI" font-size="12.5" font-weight="700" fill="#0b1220">Reuse, don't recompute</text>
  <text x="200" y="258" text-anchor="middle" font-family="Segoe UI" font-size="11.5" fill="#334155">O(n·k) → O(n) — the essence of Sliding Window</text>
</svg>
