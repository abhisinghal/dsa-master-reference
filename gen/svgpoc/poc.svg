<svg width="760" height="240" viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#94a3b8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="760" height="240" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#2563eb">Sliding Window — longest substring with ≤ 2 distinct characters</text>

  <!-- window highlight band (covers indices 1..3), shifted down for title -->
  <rect x="66" y="74" width="192" height="64" rx="10" fill="url(#win)" stroke="#2563eb" stroke-width="2"/>
  <text x="162" y="64" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">window [L..R]</text>

  <g filter="url(#sh)">
    <rect x="8"   y="82" width="56" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="72"  y="82" width="56" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="136" y="82" width="56" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="200" y="82" width="56" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="264" y="82" width="56" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <g font-size="22" font-weight="700" fill="#0b1220" text-anchor="middle">
    <text x="36"  y="114">a</text><text x="100" y="114">a</text><text x="164" y="114">b</text>
    <text x="228" y="114">c</text><text x="292" y="114">a</text>
  </g>
  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <text x="36" y="150">0</text><text x="100" y="150">1</text><text x="164" y="150">2</text>
    <text x="228" y="150">3</text><text x="292" y="150">4</text>
  </g>

  <g font-size="13" font-weight="700">
    <line x1="100" y1="180" x2="100" y2="134" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="100" y="198" text-anchor="middle" fill="#16a34a">L</text>
    <line x1="228" y1="180" x2="228" y2="134" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="228" y="198" text-anchor="middle" fill="#dc2626">R</text>
  </g>

  <g font-size="12">
    <rect x="380" y="80" width="360" height="96" rx="10" fill="#f6f8fb" stroke="#d9dee7"/>
    <text x="396" y="102" fill="#0b1220" font-weight="700">state</text>
    <text x="396" y="122" fill="#334155">distinct = { a, b, c }  →  3 &gt; 2   ✗ invalid</text>
    <text x="396" y="142" fill="#334155">action: shrink — advance L past the extra char</text>
    <text x="396" y="162" fill="#334155">best length so far = 3   (window "a a b")</text>
  </g>

  <text x="20" y="224" font-size="12" fill="#5b6472" font-style="italic">Inline SVG — colored cells, highlighted window band, labeled L/R pointers (Grokking-style).</text>
</svg>
